<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程系统 · 工作台 - 待办列表与日程</title>
    <style>
        :root {
            --brand: #FF6A00;
            --brand-light: #FFF3EA;
            --brand-grad: linear-gradient(135deg, #FF8A00, #FF5A00);
            --ing: #1890FF;
            --overdue: #F5222D;
            --todo: #8C8C8C;
            --done: #52C41A;
            --warn: #FA8C16;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --line: #EEEFF2;
            --t1: #1F2329;
            --t2: #646A73;
            --t3: #8F959E;
            --region-tag: #EBF5FF;
            --region-tag-text: #3370FF;
            --owner-sel-bg: #FFF9F5;
            --owner-sel-border: #FFD3B0;
            --self-view-accent: #FF6A00;
            --checkbox-checked: #FF6A00;
            --dropdown-hover: #FFF9F5;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, .06);
            --shadow-md: 0 8px 28px rgba(0, 0, 0, .14);
            --shadow-lg: 0 12px 36px rgba(0, 0, 0, .18);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 12px;
            --transition-fast: .15s;
            --transition-smooth: .25s;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--t1);
            font-size: 14px;
        }
        .topbar {
            height: 56px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 17px;
            margin-right: 40px;
        }
        .logo .m {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--brand-grad);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
        }
        .nav {
            display: flex;
            gap: 28px;
            height: 100%;
        }
        .nav a {
            display: flex;
            align-items: center;
            color: var(--t2);
            text-decoration: none;
            height: 100%;
            border-bottom: 2px solid transparent;
            padding: 0 2px;
            transition: color var(--transition-fast), border-color var(--transition-fast);
        }
        .nav a.on {
            color: var(--brand);
            font-weight: 600;
            border-bottom-color: var(--brand);
        }
        .topbar .right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--t2);
        }
        .bell {
            position: relative;
            cursor: pointer;
        }
        .bell .dot {
            position: absolute;
            top: -4px;
            right: -6px;
            background: var(--overdue);
            color: #fff;
            font-size: 10px;
            border-radius: 8px;
            padding: 0 4px;
            line-height: 14px;
        }
        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--brand-grad);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }
        .region-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--region-tag);
            color: var(--region-tag-text);
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid #D6E6FF;
        }
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            background: #FFF7E6;
            color: #D46B08;
            border: 1px solid #FFD591;
        }
        .crumb {
            padding: 10px 24px;
            color: var(--t3);
            font-size: 12px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .crumb b {
            color: var(--t1);
            font-weight: 500;
        }
        .wrap {
            max-width: 1440px;
            margin: 16px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 16px;
            align-items: start;
        }
        .panel {
            background: var(--card);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .panel-hd {
            padding: 16px 20px 0;
        }
        .panel-hd .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .panel-hd h3 {
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .panel-hd h3::before {
            content: "";
            width: 4px;
            height: 16px;
            background: var(--brand);
            border-radius: 2px;
            flex-shrink: 0;
        }
        .search {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            border-radius: 8px;
            padding: 6px 10px;
            width: 220px;
        }
        .search input {
            border: none;
            background: transparent;
            outline: none;
            flex: 1;
            font-size: 13px;
        }
        .tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 0;
            border-bottom: 1px solid var(--line);
        }
        .tabs::-webkit-scrollbar {
            height: 0;
        }
        .tab {
            padding: 8px 14px;
            white-space: nowrap;
            cursor: pointer;
            color: var(--t2);
            border-bottom: 2px solid transparent;
            font-size: 13px;
            position: relative;
            transition: color var(--transition-fast), border-color var(--transition-fast);
        }
        .tab .cnt {
            font-size: 11px;
            background: #F0F1F3;
            border-radius: 8px;
            padding: 0 6px;
            margin-left: 4px;
            color: var(--t3);
            transition: all var(--transition-fast);
        }
        .tab.on {
            color: var(--brand);
            font-weight: 600;
            border-bottom-color: var(--brand);
        }
        .tab.on .cnt {
            background: var(--brand-light);
            color: var(--brand);
        }
        .filters {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .pill {
            padding: 4px 12px;
            border-radius: 14px;
            background: var(--bg);
            color: var(--t2);
            cursor: pointer;
            font-size: 12px;
            border: 1px solid transparent;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            user-select: none;
        }
        .pill .pill-cnt {
            font-size: 11px;
            background: #E0E2E6;
            border-radius: 10px;
            padding: 0 6px;
            line-height: 16px;
            color: var(--t3);
            transition: all var(--transition-fast);
        }
        .pill.on {
            background: var(--brand-light);
            color: var(--brand);
            border-color: #FFD3B0;
            font-weight: 600;
        }
        .pill.on .pill-cnt {
            background: #FFD3B0;
            color: var(--brand);
            font-weight: 600;
        }
        .sort {
            margin-left: auto;
            color: var(--t3);
            font-size: 12px;
            cursor: pointer;
            transition: color var(--transition-fast);
            user-select: none;
        }
        .sort:hover {
            color: var(--brand);
        }
        .list {
            padding: 0 20px 12px;
            min-height: 400px;
            max-height: 640px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .list::-webkit-scrollbar {
            width: 6px;
        }
        .list::-webkit-scrollbar-thumb {
            background: #E0E2E6;
            border-radius: 3px;
        }
        .card {
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            gap: 14px;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
            background: #fff;
        }
        .card:hover {
            border-color: #FFC79E;
            box-shadow: 0 4px 14px rgba(255, 106, 0, .08);
        }
        .card .bar {
            width: 4px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .bar.ing {
            background: var(--ing);
        }
        .bar.overdue {
            background: var(--overdue);
        }
        .bar.todo {
            background: #C9CDD4;
        }
        .card .body {
            flex: 1;
            min-width: 0;
        }
        .card .l1 {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mod-tag {
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 4px;
            background: #EEF4FF;
            color: #3370FF;
            flex-shrink: 0;
        }
        .card .name {
            font-weight: 600;
            font-size: 14px;
        }
        .badge {
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .badge.ing {
            background: #E8F4FF;
            color: var(--ing);
        }
        .badge.overdue {
            background: #FFF0F0;
            color: var(--overdue);
        }
        .badge.todo {
            background: #F2F3F5;
            color: var(--todo);
        }
        .card .l2 {
            margin-top: 6px;
            color: var(--t3);
            font-size: 12px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .card .l2 span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card .ops {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn {
            background: var(--brand-grad);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            transition: opacity var(--transition-fast);
            white-space: nowrap;
        }
        .btn:hover {
            opacity: .88;
        }
        .btn.ghost {
            background: #fff;
            color: var(--brand);
            border: 1px solid #FFC79E;
        }
        .empty {
            text-align: center;
            color: var(--t3);
            padding: 60px 0;
        }
        .empty .e {
            font-size: 40px;
        }
        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 14px 20px 20px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--t2);
            border-top: 1px solid var(--line);
            margin-top: 4px;
        }
        .pg-total {
            color: var(--t2);
            font-size: 13px;
            margin-right: auto;
        }
        .pg-btn {
            min-width: 32px;
            height: 32px;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: #fff;
            cursor: pointer;
            color: var(--t1);
            font-size: 13px;
            padding: 0 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            user-select: none;
        }
        .pg-btn:hover:not(:disabled):not(.ellipsis) {
            border-color: var(--brand);
            color: var(--brand);
        }
        .pg-btn.on {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
            font-weight: 600;
        }
        .pg-btn:disabled {
            color: #C9CDD4;
            cursor: not-allowed;
            background: #FAFAFA;
        }
        .pg-btn.ellipsis {
            border: none;
            background: transparent;
            cursor: default;
        }
        .side {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .cal {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            transition: all var(--transition-smooth);
        }
        .cal-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .cal-hd h3 {
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cal-hd .nav-btn {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .cbtn {
            width: 26px;
            height: 26px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--line);
            background: #fff;
            cursor: pointer;
            color: var(--t2);
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        .cbtn:hover {
            border-color: var(--brand);
            color: var(--brand);
        }
        .self-view-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            border: 1.5px solid #E0E2E6;
            background: #fff;
            color: var(--t2);
            transition: all var(--transition-smooth);
            white-space: nowrap;
            user-select: none;
            position: relative;
        }
        .self-view-toggle:hover {
            border-color: #FFC79E;
            background: #FFF9F5;
        }
        .self-view-toggle.active {
            background: #FFF0E5;
            border-color: var(--brand);
            color: var(--brand);
            box-shadow: 0 2px 10px rgba(255, 106, 0, .18);
        }
        .self-view-toggle .toggle-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #C9CDD4;
            transition: all .3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .self-view-toggle.active .toggle-dot {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 1px 4px rgba(255, 106, 0, .4);
        }
        .cal-owner-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            transition: all .35s ease;
            overflow: hidden;
            max-height: 60px;
            opacity: 1;
        }
        .cal-owner-row.hidden {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            padding: 0;
            pointer-events: none;
        }
        .cal-owner-label {
            font-size: 11px;
            color: var(--t3);
            white-space: nowrap;
            font-weight: 500;
            flex-shrink: 0;
        }
        .owner-select-wrap {
            position: relative;
            flex: 1;
            min-width: 150px;
        }
        .owner-select-trigger {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: #fff;
            cursor: pointer;
            color: var(--t1);
            font-size: 12px;
            justify-content: space-between;
            transition: all var(--transition-fast);
            white-space: nowrap;
            min-height: 34px;
            user-select: none;
            position: relative;
            z-index: 2;
        }
        .owner-select-trigger:hover {
            border-color: var(--brand);
            background: var(--owner-sel-bg);
        }
        .owner-select-trigger .arr {
            font-size: 10px;
            color: var(--t3);
            transition: transform .25s ease;
            flex-shrink: 0;
        }
        .owner-select-wrap.open .owner-select-trigger {
            border-color: var(--brand);
            background: var(--owner-sel-bg);
            box-shadow: 0 0 0 3px rgba(255, 106, 0, .07);
        }
        .owner-select-wrap.open .owner-select-trigger .arr {
            transform: rotate(180deg);
            color: var(--brand);
        }
        .owner-select-trigger .selected-tags {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            max-height: 26px;
        }
        .owner-select-trigger .mini-tag {
            font-size: 10px;
            background: var(--brand-light);
            color: var(--brand);
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
            font-weight: 500;
            border: 1px solid #FFD3B0;
            letter-spacing: .2px;
        }
        .owner-select-trigger .mini-tag.more {
            background: #F0F1F3;
            color: var(--t2);
            border-color: #E0E2E6;
        }
        .owner-select-trigger .placeholder-text {
            color: var(--t3);
            font-size: 12px;
        }
        .owner-select-trigger .placeholder-text.warn {
            color: var(--warn);
            font-weight: 600;
        }
        .owner-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: none;
            z-index: 20;
            min-width: 220px;
            animation: ddFadeIn .2s ease;
        }
        @keyframes ddFadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .owner-select-wrap.open .owner-dropdown {
            display: block;
        }
        .owner-dropdown .dd-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px 8px;
            border-bottom: 1px solid var(--line);
            gap: 6px;
            flex-wrap: wrap;
            background: #FAFBFC;
        }
        .owner-dropdown .dd-header-info {
            font-size: 11px;
            color: var(--t2);
            font-weight: 500;
            white-space: nowrap;
        }
        .owner-dropdown .dd-header-info .sel-count {
            color: var(--brand);
            font-weight: 700;
        }
        .owner-dropdown .dd-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .owner-dropdown .dd-act-btn {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #E0E2E6;
            background: #fff;
            color: var(--t2);
            transition: all var(--transition-fast);
            font-weight: 500;
            white-space: nowrap;
            user-select: none;
            letter-spacing: .3px;
        }
        .owner-dropdown .dd-act-btn:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: #FFF9F5;
        }
        .owner-dropdown .dd-act-btn.primary {
            background: var(--brand-light);
            border-color: #FFD3B0;
            color: var(--brand);
            font-weight: 600;
        }
        .owner-dropdown .dd-act-btn.primary:hover {
            background: #FFE8D6;
            border-color: var(--brand);
        }
        .owner-dropdown .dd-act-btn.danger {
            color: var(--t3);
        }
        .owner-dropdown .dd-act-btn.danger:hover {
            border-color: #E0E2E6;
            color: var(--overdue);
            background: #FFF5F5;
        }
        .owner-dropdown .dd-list {
            max-height: 210px;
            overflow-y: auto;
            padding: 4px 0;
        }
        .owner-dropdown .dd-list::-webkit-scrollbar {
            width: 4px;
        }
        .owner-dropdown .dd-list::-webkit-scrollbar-thumb {
            background: #E0E2E6;
            border-radius: 2px;
        }
        .owner-dropdown .dd-item {
            padding: 9px 14px;
            cursor: pointer;
            font-size: 12px;
            color: var(--t1);
            display: flex;
            align-items: center;
            gap: 9px;
            transition: background .1s;
            user-select: none;
            border-left: 3px solid transparent;
        }
        .owner-dropdown .dd-item:hover {
            background: var(--dropdown-hover);
        }
        .owner-dropdown .dd-item.highlight {
            background: #FFFBF6;
            border-left-color: var(--brand);
        }
        .owner-dropdown .dd-item .check-box {
            width: 17px;
            height: 17px;
            border-radius: 3px;
            border: 1.5px solid #C9CDD4;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s ease;
            font-size: 10px;
            color: transparent;
            background: #fff;
        }
        .owner-dropdown .dd-item.sel .check-box {
            background: var(--checkbox-checked);
            border-color: var(--checkbox-checked);
            color: #fff;
            font-weight: 700;
        }
        .owner-dropdown .dd-item .dd-name {
            flex: 1;
            font-weight: 500;
        }
        .owner-dropdown .dd-item.sel .dd-name {
            color: var(--brand);
            font-weight: 600;
        }
        .owner-dropdown .dd-item .dd-cnt {
            font-size: 10px;
            background: #F0F1F3;
            border-radius: 8px;
            padding: 0 7px;
            line-height: 17px;
            color: var(--t3);
            font-weight: 500;
            min-width: 20px;
            text-align: center;
        }
        .owner-dropdown .dd-item.sel .dd-cnt {
            background: #FFD3B0;
            color: var(--brand);
        }
        .owner-dropdown .dd-empty {
            text-align: center;
            padding: 24px 16px;
            color: var(--t3);
            font-size: 12px;
        }
        .view-seg {
            display: inline-flex;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 2px;
            margin-bottom: 12px;
            width: 100%;
        }
        .view-seg .seg {

                    if (c.k === 'overdue') cnt = modTasks.filter(t => t.s === 'overdue').length;
                    else if (c.k === 'all') cnt = modTasks.length;
                    else if (c.k === 'ing') cnt = modTasks.filter(t => t.s === 'ing').length;

                const kw = document.getElementById('kw').value.trim();
                let arr = getMyTasksForList();
                arr = arr.filter(t => (curMod === 'all' || t.mod === curMod) && (!kw || t.name.includes(kw) || t.store

                    if (curStatus !== 'all') arr = arr.filter(t => t.s === curStatus);
                } else if (curMod === '闭店管理') {
                    if (curSub === 'all') {} else if (curSub === '待分配') arr = arr.filter(t => t.sub === '待分配');
                    else if (curSub === '待审核') arr = arr.filter(t => t.sub === '待审核');
                    else if (curSub === 'overdue') arr = arr.filter(t => t.s === 'overdue');
                } else if (curMod === '项目管理') {
                    if (curSub === 'all') {} else if (curSub === '待确认') arr = arr.filter(t => t.sub === '待确认');
                    else if (curSub === 'overdue') arr = arr.filter(t => t.s === 'overdue');
                } else if (curMod === '设计列表' || curMod === '工程预算') {
                    if (curSub === 'all') {} else if (curSub === 'overdue') arr = arr.filter(t => t.s === 'overdue');

                const w = { overdue: 0, ing: 1, todo: 2 };

            }

            function getPageNumbers(cur, total) { if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
                const p = [1]; if (cur > 4) p.push('...'); for (let i = Math.max(2, cur - 1); i <= Math.min(total - 1, cur +

                    p.push(i); if (cur < total - 3) p.push('...');
                p.push(total); return p; }

            function taskRoleOnDate(t, d) { const isToday = sameDay(d, today); if (isToday && t.end < today) return 'overdue'; if (
                    sameDay(d, t.end)) return 'due'; if (sameDay(d, t.start)) return 'start'; if (d > t.start && d < t.end)
                return 'ing'; return null; }

            function tasksOnDate(d) { const calTasks = getCalendarTasks(); return calTasks.map(t => ({ task: t,
                    role: taskRoleOnDate(t, d) })).filter(x => x.role !== null); }

            function getWeekRange(d) { const s = new Date(d);
                s.setDate(d.getDate() - d.getDay());
                const e = new Date(s);
                e.setDate(s.getDate() + 6); return { start: s, end: e }; }

            function setView(v) { calView = v;
                document.querySelectorAll('.view-seg .seg').forEach(s => s.classList.toggle('on', s.dataset.v === v)); if (v ===

            function navView(n) { if (calView === 'day') { selDate = new Date(selDate);
                    selDate.setDate(selDate.getDate() + n);
                    calYear = selDate.getFullYear();
                    calMonth = selDate.getMonth(); } else if (calView === 'week') { selDate = new Date(selDate);
                    selDate.setDate(selDate.getDate() + n * 7);
                    calYear = selDate.getFullYear();
                    calMonth = selDate.getMonth(); } else { calMonth += n; if (calMonth < 0) { calMonth = 11;
                        calYear--; } if (calMonth > 11) { calMonth = 0;
                        calYear++; } const maxDay = new Date(calYear, calMonth + 1, 0).getDate();
                    selDate = new Date(calYear, calMonth, Math.min(selDate.getDate(), maxDay)); }
                renderCal();

                renderCal();
                renderAgenda(); }

            function selectDate(y, m, d) { selDate = new Date(y, m, d);
                calYear = y;
                calMonth = m;
                renderCal();
                renderAgenda(); }

            function toggleSelfView() {
                if (!IS_LEADER) {
                    toast('您没有权限切换此视图');
                    return;
                }
                calPersonalOnly = !calPersonalOnly;
                if (calPersonalOnly) {
                    calOwnerFilters = [];
                } else {
                    calOwnerFilters = [];
                }
                updateSelfViewToggleUI();
                updateOwnerRowVisibility();
                renderOwnerDropdown();
                updateSelectedTagsDisplay();
                updateDdHeaderInfo();
                renderCal();
                renderAgenda();
                document.getElementById('crumbSelfNote').style.display = calPersonalOnly ? 'inline' : 'none';
                toast(calPersonalOnly ? '🔒 已切换：仅查看自己的日程' : '👥 已切换：查看团队日程 · 默认全选所有负责人');
            }

            function updateSelfViewToggleUI() {
                const toggle = document.getElementById('selfViewToggle');
                const dot = document.getElementById('toggleDot');
                const label = document.getElementById('toggleLabel');
                if (!IS_LEADER) {
                    toggle.style.display = 'none';
                    return;
                }
                toggle.style.display = 'inline-flex';
                if (calPersonalOnly) {
                    toggle.classList.add('active');
                    dot.textContent = '🔒';
                    label.textContent = '仅查看自己';
                } else {
                    toggle.classList.remove('active');
                    dot.textContent = '👥';
                    label.textContent = '团队日程';
                }
            }

            function updateOwnerRowVisibility() {
                const row = document.getElementById('calOwnerRow');
                if (!IS_LEADER) {
                    row.classList.add('hidden');
                    return;
                }
                if (calPersonalOnly) {
                    row.classList.add('hidden');
                } else {
                    row.classList.remove('hidden');
                }
            }

            function updateSelectedTagsDisplay() {
                const tagsEl = document.getElementById('selectedTags');
                const allOwners = getAllCalendarOwners();
                if (calOwnerFilters.length === 0) {
                    tagsEl.innerHTML = '<span class="placeholder-text">全部负责人</span>';
                } else if (calOwnerFilters.length >= allOwners.length && allOwners.length > 0) {
                    tagsEl.innerHTML = '<span class="placeholder-text warn">⚠ 未选中任何负责人</span>';
                } else if (calOwnerFilters.length <= 3) {
                    tagsEl.innerHTML = calOwnerFilters.map(o => `<span class="mini-tag">${o}</span>`).join('');
                } else {
                    const first = calOwnerFilters.slice(0, 2).map(o => `<span class="mini-tag">${o}</span>`).join('');
                    tagsEl.innerHTML = first +
                        `<span class="mini-tag more">+${calOwnerFilters.length - 2}</span>`;
                }
            }

            function updateDdHeaderInfo() {
                const selCountEl = document.getElementById('ddSelCount');
                const allOwners = getAllCalendarOwners();
                if (!selCountEl) return;
                if (calOwnerFilters.length === 0) {
                    selCountEl.textContent = '全部 (' + allOwners.length + '人)';
                    selCountEl.style.color = 'var(--brand)';
                } else if (calOwnerFilters.length >= allOwners.length && allOwners.length > 0) {
                    selCountEl.textContent = '0 / ' + allOwners.length + ' 人';
                    selCountEl.style.color = 'var(--overdue)';
                } else {
                    selCountEl.textContent = calOwnerFilters.length + ' / ' + allOwners.length + ' 人';
                    selCountEl.style.color = 'var(--brand)';
                }
            }

            function renderOwnerDropdown() {
                const allOwners = getAllCalendarOwners();
                const ownerCounts = {};
                const regionTasks = getRegionFilteredTasks(tasks);
                allOwners.forEach(o => {
                    ownerCounts[o] = regionTasks.filter(t => t.owner === o).length;
                });
                const ddList = document.getElementById('ownerDdList');
                const isAllSelected = calOwnerFilters.length === 0;
                const isNoneSelected = calOwnerFilters.length >= allOwners.length && allOwners.length > 0;
                if (allOwners.length === 0) {
                    ddList.innerHTML = '<div class="dd-empty">暂无可用负责人</div>';
                } else {
                    ddList.innerHTML = allOwners.map(o => {
                        const isSel = isAllSelected ? true : (isNoneSelected ? false : calOwnerFilters.includes(
                            o));
                        const selClass = isSel ? 'sel' : '';
                        const escapedOwner = o.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        return `<div class="dd-item ${selClass}" onclick="event.stopPropagation();toggleOwnerItem('${escapedOwner}')">
                            <span class="check-box">${isSel ? '✓' : ''}</span>
                            <span class="dd-name">${o}${o === CURRENT_USER ? ' <span style="font-size:10px;color:var(--brand);">(我)</span>' : ''}</span>
                            <span class="dd-cnt">${ownerCounts[o]}</span>
                        </div>`;
                    }).join('');
                }
                updateSelectedTagsDisplay();
                updateDdHeaderInfo();
            }

            function toggleOwnerItem(owner) {
                const allOwners = getAllCalendarOwners();
                const isAllSelected = calOwnerFilters.length === 0;
                const isNoneSelected = calOwnerFilters.length >= allOwners.length && allOwners.length > 0;
                if (isAllSelected) {
                    calOwnerFilters = allOwners.filter(o => o !== owner);
                    if (calOwnerFilters.length === 0 && allOwners.length === 1) {
                        calOwnerFilters = [];
                    }
                } else if (isNoneSelected) {
                    calOwnerFilters = [owner];
                } else {
                    const idx = calOwnerFilters.indexOf(owner);
                    if (idx >= 0) {
                        calOwnerFilters.splice(idx, 1);
                    } else {
                        calOwnerFilters.push(owner);
                    }
                    if (calOwnerFilters.length >= allOwners.length) {
                        calOwnerFilters = [];
                    }
                    if (calOwnerFilters.length === 0 && allOwners.length > 0) {
                        calOwnerFilters = [];
                    }
                }
                renderOwnerDropdown();
                updateSelectedTagsDisplay();
                updateDdHeaderInfo();
                renderCal();
                renderAgenda();
                const modeLabel = calOwnerFilters.length === 0 ? '全部负责人' : (calOwnerFilters.length >= allOwners
                    .length ? '未选中任何负责人' : calOwnerFilters.join(', '));
                toast('👤 已筛选：' + modeLabel);
            }

            function ownerSelectAll() {
                calOwnerFilters = [];
                renderOwnerDropdown();
                updateSelectedTagsDisplay();
                updateDdHeaderInfo();
                renderCal();
                renderAgenda();
                toast('✅ 已全选所有负责人');
            }

            function ownerClearAll() {
                const allOwners = getAllCalendarOwners();
                if (allOwners.length === 0) {
                    toast('⚠ 暂无可清空的负责人');
                    return;
                }
                calOwnerFilters = [...allOwners];
                renderOwnerDropdown();
                updateSelectedTagsDisplay();
                updateDdHeaderInfo();
                renderCal();
                renderAgenda();
                toast('↺ 已清空筛选，当前不显示任何日程');
            }

            function toggleOwnerDropdown(e) {
                if (calPersonalOnly || !IS_LEADER) {
                    toast('请先切换到"团队日程"模式');
                    return;
                }
                if (e) e.stopPropagation();
                const wrap = document.getElementById('ownerSelectWrap');
                const isOpen = wrap.classList.contains('open');
                if (isOpen) {
                    wrap.classList.remove('open');
                } else {
                    renderOwnerDropdown();
                    updateDdHeaderInfo();
                    wrap.classList.add('open');
                }
            }
            document.addEventListener('click', function(e) {
                const wrap = document.getElementById('ownerSelectWrap');
                if (wrap && wrap.classList.contains('open') && !wrap.contains(e.target)) {
                    wrap.classList.remove('open');
                }
            });

            function renderCal() { const t = document.getElementById('calTitle'),
                    b = document.getElementById('calBody'); if (calView === 'month') { t.textContent =
                        `${calYear}年${calMonth+1}月`;
                    b.innerHTML = renderMonthGrid(); } else if (calView === 'week') { const { start, end } = getWeekRange(
                    selDate);
                    t.textContent =
                        `${start.getFullYear()}年 ${fmt(start).split(' ')[0]} ~ ${fmt(end).split(' ')[0]}`;
                    b.innerHTML = renderWeekView(start); } else { t.textContent =
                        `${selDate.getFullYear()}年${selDate.getMonth()+1}月${selDate.getDate()}日`;
                    b.innerHTML = renderDayView(); }
                updateSelfViewToggleUI();
                updateOwnerRowVisibility();
                renderOwnerDropdown();
                updateDdHeaderInfo(); }

            function renderMonthGrid() { const f = new Date(calYear, calMonth, 1),
                    sIdx = f.getDay(),
                    days = new Date(calYear, calMonth + 1, 0).getDate();
                let h =
                    `<div class="cal-grid">${['日','一','二','三','四','五','六'].map(w=>`<div class="wk">${w}</div>`).join('')}`;
                for (let i = 0; i < sIdx; i++) { const d = new Date(calYear, calMonth, 1 - sIdx + i);
                    h +=
                        `<div class="day dim" onclick="selectDate(${d.getFullYear()},${d.getMonth()},${d.getDate()})">${d.getDate()}</div>`; }
                for (let i = 1; i <= days; i++) { const d = new Date(calYear, calMonth, i);
                    const set = new Set(tasksOnDate(d).map(x => x.role));
                    const dc = { overdue: 'var(--overdue)', due: 'var(--warn)', start: 'var(--ing)', ing: '#C9CDD4' };
                    const dots = ['overdue', 'due', 'start', 'ing'].filter(k => set.has(k)).slice(0, 3).map(k =>
                        `<i style="background:${dc[k]}"></i>`).join('');
                    const isToday = sameDay(d, today);
                    const calTasks = getCalendarTasks();
                    const overdueCnt = isToday ? calTasks.filter(t => t.end < today).length : 0;
                    const badge = overdueCnt > 0 ? `<span class="cnt-badge">${overdueCnt}</span>` : '';
                    const cls = [isToday ? 'today' : '', sameDay(d, selDate) ? 'sel' : '', (d >= getWeekRange(selDate).start &&
                        d <= getWeekRange(selDate).end) ? 'in-week' : ''].join(' ');
                    h +=
                        `<div class="day ${cls}" onclick="selectDate(${calYear},${calMonth},${i})">${badge}${i}<div class="dots">${dots}</div></div>`; }
                h += `</div>`;
                return h; }

            function renderWeekView(start) { const wks = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                let h = `<div class="week-view">`;
                for (let i = 0; i < 7; i++) { const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    const list = tasksOnDate(d);
                    const set = new Set(list.map(x => x.role));
                    const dc = { overdue: 'var(--overdue)', due: 'var(--warn)', start: 'var(--ing)', ing: '#C9CDD4' };
                    const dots = ['overdue', 'due', 'start', 'ing'].filter(k => set.has(k)).map(k =>
                        `<i style="background:${dc[k]}"></i>`).join('');
                    const cls = [sameDay(d, today) ? 'today' : '', sameDay(d, selDate) ? 'sel' : ''].join(' ');
                    const keyCnt = list.filter(x => x.role === 'overdue' || x.role === 'due' || x.role === 'start')
                        .length;
                    const dateStr = fmt(d).split(' ')[0];
                    const subText = keyCnt > 0 ?
                        `${dateStr} · <b style="color:${sameDay(d,selDate)?'#fff':'var(--brand)'}">${keyCnt}</b> 项需关注 / 共 ${list.length} 项` :
                        `${dateStr} · 共 ${list.length} 项日程`;
                    h +=
                        `<div class="week-day ${cls}" onclick="selectDate(${d.getFullYear()},${d.getMonth()},${d.getDate()})"><div class="wd-date">${d.getDate()}</div><div class="wd-info"><div class="wd-wk">${wks[i]}${sameDay(d,today)?' · 今天':''}</div><div class="wd-sub">${subText}</div></div><div class="wd-dots">${dots}</div></div>`; }
                h += `</div>`;
                return h; }

            function renderDayView() { const list = tasksOnDate(selDate);
                const cnt = { overdue: 0, due: 0, start: 0, ing: 0 };
                list.forEach(x => cnt[x.role]++);
                const isToday = sameDay(selDate, today);
                const dayName = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][selDate.getDay()];
                return `<div style="padding:20px;background:var(--bg);border-radius:10px;text-align:center;"><div style="font-size:36px;font-weight:700;color:var(--brand);">${selDate.getDate()}</div><div style="color:var(--t2);margin-top:4px;">${dayName}${isToday?' · 今天':''}</div><div style="margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:13px;"><div><span style="color:var(--overdue);font-weight:700;font-size:20px;">${cnt.overdue}</span><div style="color:var(--t3);font-size:11px;">超期</div></div><div><span style="color:var(--warn);font-weight:700;font-size:20px;">${cnt.due}</span><div style="color:var(--t3);font-size:11px;">截止</div></div><div><span style="color:var(--ing);font-weight:700;font-size:20px;">${cnt.start}</span><div style="color:var(--t3);font-size:11px;">开始</div></div><div><span style="color:var(--t2);font-weight:700;font-size:20px;">${cnt.ing}</span><div style="color:var(--t3);font-size:11px;">进行中</div></div></div></div>`; }

            function setAgFilter(f, el) { agFilter = f;
                document.querySelectorAll('.ag-qf').forEach(q => q.classList.toggle('on', q.dataset.f === f));
                renderAgendaList(); }

            function renderAgenda() {
                const isToday = sameDay(selDate, today),
                    isPast = selDate < today,
                    isFuture = selDate > today;
                const showStart = !isFuture;
                const dayName = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][selDate.getDay()];
                let title = isToday ? `今日日程 · ${dayName}` : `${fmt(selDate).split(' ')[0]} · ${dayName}日程`;
                const list = tasksOnDate(selDate);
                document.getElementById('agTitle').textContent = title;
                document.getElementById('agCnt').textContent = `共 ${list.length} 项`;
                const viewLabel = calPersonalOnly ? `🔒 仅自己 · ${CURRENT_USER}` : `📍 ${USER_REGION}团队`;
                const allOwners = getAllCalendarOwners();
                const isFiltered = (!calPersonalOnly && calOwnerFilters.length > 0 && calOwnerFilters.length < allOwners
                    .length);
                const isCleared = (!calPersonalOnly && calOwnerFilters.length >= allOwners.length && allOwners.length >
                    0);
                const ownerLabel = isCleared ? ' · ⚠ 未选中任何负责人' : (isFiltered ? ` · 负责人：${calOwnerFilters.join(', ')}` : (
                    calPersonalOnly ? '' : ' · 全部负责人'));
                let desc = isToday ? `今日需处理：${viewLabel}${ownerLabel}` : (isFuture ?
                    `${Math.round((selDate-today)/864e5)} 天后 · ${viewLabel}${ownerLabel}` :
                    `${Math.round((today-selDate)/864e5)} 天前 · ${viewLabel}${ownerLabel}`);
                document.getElementById('agSubDesc').textContent = desc;
                const cnt = { overdue: 0, due: 0, start: 0, ing: 0 };
                list.forEach(x => cnt[x.role]++);
                let summaryHtml =
                    `<div class="ag-sum-card overdue" onclick="setAgFilter('overdue',document.querySelector('.ag-qf[data-f=overdue]'))"><div class="ag-sum-num c-overdue">${cnt.overdue}</div><div class="ag-sum-label">🔥 超期</div></div><div class="ag-sum-card due" onclick="setAgFilter('due',document.querySelector('.ag-qf[data-f=due]'))"><div class="ag-sum-num c-warn">${cnt.due}</div><div class="ag-sum-label">⏰ 截止</div></div>`;
                if (showStart) summaryHtml +=
                    `<div class="ag-sum-card start" onclick="setAgFilter('start',document.querySelector('.ag-qf[data-f=start]'))"><div class="ag-sum-num c-ing">${cnt.start}</div><div class="ag-sum-label">🚀 开始</div></div>`;
                document.getElementById('agSummary').innerHTML = summaryHtml;
                document.getElementById('agSummary').className = 'ag-summary' + (showStart ? '' : ' two-col');
                let qfHtml =
                    `<div class="ag-qf on" data-f="all" onclick="setAgFilter('all',this)">全部</div><div class="ag-qf" data-f="overdue" onclick="setAgFilter('overdue',this)">🔥 超期</div><div class="ag-qf" data-f="due" onclick="setAgFilter('due',this)">⏰ 截止</div>`;
                if (showStart) qfHtml +=
                    `<div class="ag-qf" data-f="start" onclick="setAgFilter('start',this)">🚀 开始</div>`;
                document.getElementById('agQuickFilter').innerHTML = qfHtml;
                document.getElementById('agQuickFilter').style.display = list.length ? 'flex' : 'none';
                document.getElementById('agSummary').style.display = list.length ? 'grid' : 'none';
                renderAgendaList();
            }

            function renderAgendaList() {
                const list = tasksOnDate(selDate),
                    isToday = sameDay(selDate, today),
                    isFuture = selDate > today;
                const showStart = !isFuture;
                const el = document.getElementById('agList');
                const viewLabel = calPersonalOnly ? `🔒 仅查看自己（${CURRENT_USER}）` : `📍 ${USER_REGION}团队`;
                if (!list.length) { el.innerHTML =
                        `<div class="ag-empty"><div class="e">☕</div><div>${isToday?'今日':fmt(selDate).split(' ')[0]+' '}暂无工程节点</div><div style="font-size:10px;color:var(--t3);margin-top:4px;">${viewLabel}</div></div>`
                    ; return; }
                let filtered = list;
                if (agFilter !== 'all') filtered = list.filter(x => x.role === agFilter);
                if (!filtered.length) { el.innerHTML =
                        `<div class="ag-empty"><div class="e">🎯</div><div>该筛选条件下暂无任务</div></div>`
                    ; return; }
                const groups = { overdue: { label: '🔥 已超期 · 请立即处理', tag: '超期', items: [] }, due: { label: '⏰ 截止 · 优先处理',
                        tag: '截止', items: [] } };
                if (showStart) groups.start = { label: '🚀 新开始的任务', tag: '开始', items: [] };
                groups.ing = { label: '⏱ 进行中', tag: '进行中', items: [] };
                filtered.forEach(x => { if (groups[x.role]) groups[x.role].items.push(x); });
                let html = '';
                ['overdue', 'due', 'start', 'ing'].forEach(k => { if (!groups[k] || !groups[k].items.length) return;
                    const g = groups[k];
                    html +=
                        `<div class="ag-group ${k}"><div class="ag-group-hd"><span>${g.label}</span><span class="g-cnt">${g.items.length}</span></div>`;
                    g.items.forEach(x => { const t = x.task,
                            role = x.role;
                        let tip = ''; if (role === 'overdue') { const days = Math.round((today - t.end) /
                            864e5);
                            tip = `⚠ 已超期 ${days} 天`; } else if (role === 'due') { tip = isToday ?
                                `⚠ 今日 ${fmt(t.end).split(' ')[1]} 截止` : `⚠ 截止日`; } else if (role ===
                            'start') { const dur = Math.round((t.end - t.start) / 864e5) + 1;
                            tip = `📅 开始于 ${fmt(t.start).split(' ')[1]}，共 ${dur} 天`; } else if (role === 'ing') { const
                                left = Math.round((t.end - selDate) / 864e5);
                            tip = `⏳ 距截止还有 ${left} 天`; }
                        html +=
                            `<div class="ag-item ${role}" onclick="openDrawer(${t.id})"><div class="ag-time-col"><span class="ag-time-tag ${role}">${g.tag}</span><span class="ag-time-day">${role==='start'?fmt(t.start):fmt(t.end)}</span></div><div class="ag-body"><div class="ag-name-row"><span class="ag-mod">${t.mod}</span><span class="ag-name">${t.name}</span></div><div class="ag-meta"><span>🏪 ${t.store.split('·')[0]}</span><span>👤 ${t.owner}</span></div><div class="ag-tip ${role}">${tip}</div></div></div>`; });
                    html += `</div>`; });
                el.innerHTML = html;
            }
            let curTask = null;

            function openDrawer(id) { curTask = tasks.find(t => t.id === id);
                document.getElementById('dwTitle').textContent = curTask.name;
                document.getElementById('dwBody').innerHTML =
                    `<div class="dw-row"><div class="k">所属模块</div><div class="v"><span class="mod-tag">${curTask.mod}</span></div></div><div class="dw-row"><div class="k">时间状态</div><div class="v"><span class="badge ${curTask.s}">${SICON[curTask.s]} ${curTask.txt}</span></div></div><div class="dw-row"><div class="k">门店 / 项目</div><div class="v">${curTask.store}</div></div><div class="dw-row"><div class="k">行政区划</div><div class="v"><span class="region-badge">📍 ${getStoreRegion(curTask.store)}</span></div></div><div class="dw-row"><div class="k">任务接收对象</div><div class="v">${curTask.owner}${curTask.owner===CURRENT_USER?' <span class="role-badge" style="font-size:10px;">👤 自己</span>':''}</div></div><div class="dw-row"><div class="k">预计起止</div><div class="v">${fmt(curTask.start)} ~ ${fmt(curTask.end)}</div></div><div class="dw-row"><div class="k">触发条件</div><div class="v">${curTask.trigger}</div></div><div class="dw-row"><div class="k">时间规则</div><div class="v">${curTask.rule}</div></div><div class="dw-row"><div class="k">处理跳转目标</div><div class="v" style="color:var(--brand)">${curTask.jump}</div></div>`;
                document.getElementById('dwGo').onclick = () => { toast('跳转至：' + curTask.jump);
                    closeDrawer(); };
                document.getElementById('mask').classList.add('show');
                document.getElementById('drawer').classList.add('show'); }

            function closeDrawer() { document.getElementById('mask').classList.remove('show');
                document.getElementById('drawer').classList.remove('show'); }
            let toastTimer;

            function toast(msg) { const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => t.classList.remove('show'), 2000); }
            document.getElementById('topRegionBadge').textContent = ' ' ;
            if (IS_LEADER) {
                document.getElementById('topRoleBadge').textContent = '';
                document.getElementById('topRoleBadge').style.display = 'inline-flex';
            } else {
                document.getElementById('topRoleBadge').style.display = 'none';
            }
            updateSelfViewToggleUI();
            updateOwnerRowVisibility();
            document.getElementById('crumbSelfNote').style.display = calPersonalOnly ? 'inline' : 'none';
            window.toggleOwnerDropdown = toggleOwnerDropdown;
            window.toggleOwnerItem = toggleOwnerItem;
            window.ownerSelectAll = ownerSelectAll;
            window.ownerClearAll = ownerClearAll;
            window.toggleSelfView = toggleSelfView;
            window.setView = setView;
            window.navView = navView;
            window.backToday = backToday;
            window.selectDate = selectDate;
            window.setAgFilter = setAgFilter;
            window.openDrawer = openDrawer;
            window.closeDrawer = closeDrawer;
            window.setFilter = setFilter;
            window.setMod = setMod;
            window.toggleSort = toggleSort;
            window.goPage = goPage;
            window.onSearch = onSearch;
            window.toast = toast;
            render();
            renderCal();
            renderAgenda();
            renderOwnerDropdown();
            updateDdHeaderInfo();
        })();
    </script>
</body>
</html>
