<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>人员项目占比看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "Microsoft YaHei", -apple-system, sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
        padding: 20px;
    }
    .container {
        max-width: 1400px;
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        overflow: hidden;
    }
    /* 看板视图 */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        border-bottom: 1px solid #eee;
        background: #fff;
    }
    .header h2 {
        font-size: 18px;
        color: #333;
        font-weight: 600;
    }
    .close-btn {
        width: 32px; height: 32px;
        border-radius: 50%;
        background: transparent;
        border: none;
        font-size: 22px;
        color: #999;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .close-btn:hover { background: #f5f5f5; color: #333; }
    #chart {
        width: 100%;
        height: 620px;
    }
    .tips {
        padding: 10px 24px;
        background: #fffbe6;
        border-top: 1px solid #ffe58f;
        color: #ad6800;
        font-size: 13px;
    }
    .tips::before { content: "💡 "; }
    
    /* 列表视图 */
    .list-view { display: none; }
    .list-view.active { display: block; }
    .board-view.hidden { display: none; }
    
    .list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        border-bottom: 1px solid #eee;
    }
    .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }
    .breadcrumb .back {
        color: #1890ff;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .breadcrumb .back:hover { text-decoration: underline; }
    .breadcrumb .sep { color: #ccc; }
    .breadcrumb .current { color: #333; font-weight: 500; }
    
    .filter-bar {
        display: flex;
        gap: 12px;
        padding: 16px 24px;
        background: #fafafa;
        border-bottom: 1px solid #eee;
        flex-wrap: wrap;
        align-items: center;
    }
    .filter-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        background: #e6f7ff;
        border: 1px solid #91d5ff;
        border-radius: 4px;
        color: #1890ff;
        font-size: 13px;
    }
    .filter-tag .close {
        cursor: pointer;
        font-size: 14px;
        color: #999;
    }
    .filter-tag .close:hover { color: #f5222d; }
    .search-input {
        padding: 6px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        font-size: 13px;
        width: 220px;
        outline: none;
        transition: border 0.2s;
    }
    .search-input:focus { border-color: #1890ff; }
    .result-count {
        margin-left: auto;
        color: #666;
        font-size: 13px;
    }
    .result-count strong { color: #1890ff; }
    
    .table-wrap {
        padding: 16px 24px;
        overflow-x: auto;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        min-width: 1600px;
    }
    thead th {
        background: #fafafa;
        padding: 12px 10px;
        text-align: left;
        font-weight: 600;
        color: #333;
        border-bottom: 2px solid #e8e8e8;
        white-space: nowrap;
    }
    tbody td {
        padding: 12px 10px;
        border-bottom: 1px solid #f0f0f0;
        color: #555;
        white-space: nowrap;
    }
    tbody tr:hover { background: #f5faff; }
    .status-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 500;
    }
    .proj-code {
        color: #1890ff;
        font-weight: 500;
        cursor: pointer;
    }
    .proj-code:hover { text-decoration: underline; }
    
    .pagination {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        padding: 16px 24px;
        border-top: 1px solid #f0f0f0;
    }
    .page-btn {
        min-width: 32px;
        height: 32px;
        border: 1px solid #d9d9d9;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
        color: #333;
        font-size: 13px;
        transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) { border-color: #1890ff; color: #1890ff; }
    .page-btn.active { background: #1890ff; color: #fff; border-color: #1890ff; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .empty {
        text-align: center;
        padding: 60px 20px;
        color: #999;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
    <!-- 看板视图 -->
    <div class="board-view" id="boardView">
        <div class="header">
            <h2>人员项目占比</h2>
            <button class="close-btn" title="关闭">×</button>
        </div>
        <div id="chart"></div>
        <div class="tips">点击图表中的任意色块可查看该状态下的详细项目列表</div>
    </div>
    
    <!-- 列表视图 -->
    <div class="list-view" id="listView">
        <div class="list-header">
            <div class="breadcrumb">
                <span class="back" onclick="backToBoard()">← 返回看板</span>
                <span class="sep">/</span>
                <span>人员项目占比</span>
                <span class="sep">/</span>
                <span class="current" id="crumbCurrent">项目列表</span>
            </div>
            <button class="close-btn" onclick="backToBoard()">×</button>
        </div>
        <div class="filter-bar" id="filterBar"></div>
        <div class="table-wrap">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>项目编号</th>
                        <th>项目名称</th>
                        <th>项目工时</th>
                        <th>项目工期</th>
                        <th>开始日期</th>
                        <th>结束日期</th>
                        <th>预计结束日期</th>
                        <th>项目状态</th>
                        <th>工程节点</th>
                        <th>工程监理</th>
                        <th>工程支持</th>
                        <th>所属品牌</th>
                        <th>区域地址</th>
                        <th>创建时间</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<script>
// ============ 9个状态配置 ============
const STATUS_LIST = [
    { key: 'untook',    name: '未交铺', color: '#8c8c8c' },
    { key: 'survey',    name: '勘场中', color: '#1890ff' },
    { key: 'finalize',  name: '定稿中', color: '#52c41a' },
    { key: 'design',    name: '设计中', color: '#722ed1' },
    { key: 'budget',    name: '预算中', color: '#faad14' },
    { key: 'waiting',   name: '待进场', color: '#13c2c2' },
    { key: 'construct', name: '施工中', color: '#fa8c16' },
    { key: 'check',     name: '核量中', color: '#eb2f96' },
    { key: 'pause',     name: '暂停中', color: '#bfbfbf' }
];

// ============ 人员数据（每人9个状态的项目数量） ============
const PERSON_DATA = [
    { name: '喻卓理', values: [2, 39, 3, 3, 5, 4, 24, 6, 2] },
    { name: '杜冠昭', values: [1, 24, 1, 3, 2, 3, 16, 8, 3] },
    { name: '蒋琦',   values: [0, 32, 1, 2, 1, 2, 12, 3, 1] },
    { name: '李勇霖', values: [1, 19, 0, 3, 2, 1, 18, 1, 2] },
    { name: '梁峥',   values: [0, 12, 1, 0, 1, 1, 10, 3, 0] },
    { name: '蒋团顺', values: [0, 12, 1, 2, 0, 1, 6, 0, 3] },
    { name: '周煜杰', values: [0, 14, 0, 1, 1, 1, 8, 1, 0] },
    { name: '区宏星', values: [1, 12, 1, 2, 0, 1, 6, 0, 2] },
    { name: '梁雪强', values: [1, 4, 1, 1, 0, 1, 9, 2, 2] }
];

// ============ 生成模拟项目数据 ============
const BRANDS = ['星巴克','肯德基','喜茶','麦当劳','海底捞','奈雪的茶','蜜雪冰城','瑞幸咖啡'];
const REGIONS = ['广东省深圳市南山区','广东省广州市天河区','上海市浦东新区','北京市朝阳区','江苏省苏州市工业园区','浙江省杭州市西湖区','四川省成都市锦江区','湖北省武汉市江汉区'];
const NODES = ['方案初稿','图纸交底','材料进场','水电验收','土建完成','装饰完成','消防验收','终验交付'];
const SUPERVISORS = ['陈志强','李国华','王建军','刘明辉','赵永刚','孙宇'];
const SUPPORTS = ['张伟','林芳','黄晓东','周雅静','吴俊'];

function pad(n){return n<10?'0'+n:n;}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDateTime(d){return fmtDate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(arr){return arr[rand(0,arr.length-1)];}

// 为每个人的每个状态生成项目
const ALL_PROJECTS = [];
let pid = 10001;
PERSON_DATA.forEach(person => {
    person.values.forEach((count, sIdx) => {
        const status = STATUS_LIST[sIdx];
        for(let i=0;i<count;i++){
            const startD = new Date(2024, rand(0,11), rand(1,28));
            const duration = rand(30, 180);
            const endD = new Date(startD.getTime() + duration*86400000);
            const estEndD = new Date(endD.getTime() + rand(-10,20)*86400000);
            const createD = new Date(startD.getTime() - rand(5,30)*86400000);
            createD.setHours(rand(8,20),rand(0,59),rand(0,59));
            ALL_PROJECTS.push({
                code: 'PRJ' + (pid++),
                name: pick(BRANDS) + pick(['深圳万象城店','广州天环店','上海环球港店','北京三里屯店','杭州湖滨店','成都太古里店','武汉光谷店','苏州中心店']),
                hours: rand(80, 800),
                duration: duration + '天',
                startDate: fmtDate(startD),
                endDate: fmtDate(endD),
                estEndDate: fmtDate(estEndD),
                status: status.name,
                statusKey: status.key,
                statusColor: status.color,
                node: pick(NODES),
                supervisor: pick(SUPERVISORS),
                support: pick(SUPPORTS),
                brand: pick(BRANDS),
                region: pick(REGIONS),
                createTime: fmtDateTime(createD),
                owner: person.name
            });
        }
    });
});

// ============ 渲染 ECharts ============
const chart = echarts.init(document.getElementById('chart'));
const persons = PERSON_DATA.map(p => p.name);

const series = STATUS_LIST.map((s, idx) => ({
    name: s.name,
    type: 'bar',
    stack: 'total',
    barWidth: 26,
    itemStyle: { color: s.color },
    label: {
        show: true,
        color: '#fff',
        fontWeight: 'bold',
        fontSize: 12,
        formatter: p => p.value > 0 ? p.value : ''
    },
    data: PERSON_DATA.map(p => p.values[idx])
}));

// 添加总数标签
const totals = PERSON_DATA.map(p => p.values.reduce((a,b)=>a+b,0));

chart.setOption({
    tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        formatter: params => {
            let html = params[0].name + '<br/>';
            let total = 0;
            params.forEach(p => {
                if(p.value>0){
                    html += `<span style="display:inline-block;width:10px;height:10px;background:${p.color};border-radius:2px;margin-right:6px;"></span>${p.seriesName}: <b>${p.value}</b><br/>`;
                    total += p.value;
                }
            });
            html += `<div style="border-top:1px solid #eee;margin-top:6px;padding-top:6px;">合计: <b>${total}</b></div>`;
            return html;
        }
    },
    legend: {
        data: STATUS_LIST.map(s => s.name),
        bottom: 10,
        itemWidth: 14,
        itemHeight: 14,
        textStyle: { fontSize: 12 }
    },
    grid: { left: 80, right: 80, top: 20, bottom: 60 },
    xAxis: {
        type: 'value',
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: '#f0f0f0' } }
    },
    yAxis: {
        type: 'category',
        data: persons,
        inverse: true,
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { fontSize: 13, color: '#333' }
    },
    series: series.concat([{
        // 用于显示总数的透明系列
        name: '总计',
        type: 'bar',
        stack: 'total',
        barWidth: 26,
        itemStyle: { color: 'transparent' },
        label: {
            show: true,
            position: 'right',
            fontSize: 13,
            color: '#333',
            fontWeight: 'bold',
            formatter: p => totals[p.dataIndex]
        },
        data: persons.map(() => 0),
        tooltip: { show: false }
    }])
});

// ============ 点击事件：跳转到列表 ============
chart.on('click', function(params){
    if(params.componentType !== 'series') return;
    if(params.seriesName === '总计') return;
    if(params.value === 0) return;
    
    const statusObj = STATUS_LIST.find(s => s.name === params.seriesName);
    const personName = params.name;
    
    showList({
        person: personName,
        statusKey: statusObj.key,
        statusName: statusObj.name,
        statusColor: statusObj.color
    });
});

// ============ 列表视图 ============
let currentFilter = null;
let currentPage = 1;
const PAGE_SIZE = 10;
let filteredData = [];

function showList(filter){
    currentFilter = filter;
    currentPage = 1;
    
    document.getElementById('boardView').classList.add('hidden');
    document.getElementById('listView').classList.add('active');
    
    // 过滤数据
    filteredData = ALL_PROJECTS.filter(p => 
        p.owner === filter.person && p.statusKey === filter.statusKey
    );
    
    // 面包屑
    document.getElementById('crumbCurrent').textContent = 
        `${filter.person} - ${filter.statusName}`;
    
    // 过滤标签
    document.getElementById('filterBar').innerHTML = `
        <span class="filter-tag">
            责任人: ${filter.person}
        </span>
        <span class="filter-tag" style="background:${filter.statusColor}20;border-color:${filter.statusColor};color:${filter.statusColor};">
            项目状态: ${filter.statusName}
        </span>
        <input type="text" class="search-input" placeholder="搜索项目编号/名称..." 
               oninput="handleSearch(this.value)">
        <span class="result-count">共找到 <strong id="cntNum">${filteredData.length}</strong> 条数据</span>
    `;
    
    renderTable();
}

function handleSearch(kw){
    const key = kw.trim().toLowerCase();
    if(!key){
        filteredData = ALL_PROJECTS.filter(p => 
            p.owner === currentFilter.person && p.statusKey === currentFilter.statusKey
        );
    } else {
        filteredData = ALL_PROJECTS.filter(p => 
            p.owner === currentFilter.person && 
            p.statusKey === currentFilter.statusKey &&
            (p.code.toLowerCase().includes(key) || p.name.toLowerCase().includes(key))
        );
    }
    document.getElementById('cntNum').textContent = filteredData.length;
    currentPage = 1;
    renderTable();
}

function renderTable(){
    const tbody = document.getElementById('tableBody');
    if(filteredData.length === 0){
        tbody.innerHTML = `<tr><td colspan="14"><div class="empty">
            <div class="empty-icon">📋</div>
            <div>暂无符合条件的项目数据</div>
        </div></td></tr>`;
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    
    const start = (currentPage-1)*PAGE_SIZE;
    const pageData = filteredData.slice(start, start+PAGE_SIZE);
    
    tbody.innerHTML = pageData.map(p => `
        <tr>
            <td><span class="proj-code">${p.code}</span></td>
            <td>${p.name}</td>
            <td>${p.hours} 小时</td>
            <td>${p.duration}</td>
            <td>${p.startDate}</td>
            <td>${p.endDate}</td>
            <td>${p.estEndDate}</td>
            <td><span class="status-badge" style="background:${p.statusColor}20;color:${p.statusColor};">${p.status}</span></td>
            <td>${p.node}</td>
            <td>${p.supervisor}</td>
            <td>${p.support}</td>
            <td>${p.brand}</td>
            <td>${p.region}</td>
            <td>${p.createTime}</td>
        </tr>
    `).join('');
    
    renderPagination();
}

function renderPagination(){
    const total = filteredData.length;
    const totalPages = Math.ceil(total/PAGE_SIZE);
    const pg = document.getElementById('pagination');
    
    if(totalPages<=1){
        pg.innerHTML = `<span style="color:#999;font-size:13px;">共 ${total} 条</span>`;
        return;
    }
    
    let html = `<span style="color:#999;font-size:13px;margin-right:12px;">共 ${total} 条</span>`;
    html += `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="gotoPage(${currentPage-1})">上一页</button>`;
    
    for(let i=1;i<=totalPages;i++){
        if(i===1 || i===totalPages || Math.abs(i-currentPage)<=1){
            html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="gotoPage(${i})">${i}</button>`;
        } else if(Math.abs(i-currentPage)===2){
            html += `<span style="color:#999;">...</span>`;
        }
    }
    
    html += `<button class="page-btn" ${currentPage===totalPages?'disabled':''} onclick="gotoPage(${currentPage+1})">下一页</button>`;
    pg.innerHTML = html;
}

function gotoPage(p){
    currentPage = p;
    renderTable();
}

function backToBoard(){
    document.getElementById('boardView').classList.remove('hidden');
    document.getElementById('listView').classList.remove('active');
}

// 响应式
window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
