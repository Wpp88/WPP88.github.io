<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>工程驾驶舱大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: radial-gradient(circle at 10% 20%, #0a1f3e, #030b1a); font-family: 'Microsoft YaHei', 'PingFang SC', Roboto, sans-serif; overflow-x: auto; padding: 20px; color: #eef5ff; }
        .dashboard { max-width: 1920px; margin: 0 auto; background: rgba(8,20,40,0.55); backdrop-filter: blur(3px); border-radius: 32px; box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,255,255,0.1); overflow: hidden; border: 1px solid rgba(0,255,255,0.2); }
        .top-header { display: flex; justify-content: flex-end; padding: 16px 28px 0; }
        .current-time { background: rgba(10,30,55,0.7); backdrop-filter: blur(4px); border-radius: 40px; padding: 8px 20px; font-size: 16px; font-weight: 500; border: 1px solid rgba(0,200,255,0.5); letter-spacing: 1px; }
        .current-time i { margin-right: 8px; color: #00ccff; }
        .top-stats { display: grid; grid-template-columns: repeat(8, 1fr); gap: 18px; padding: 20px 28px 20px; background: rgba(2,12,27,0.7); border-bottom: 1px solid rgba(0,255,255,0.3); }
        .stat-card { background: rgba(10,30,55,0.65); backdrop-filter: blur(8px); border-radius: 32px; padding: 18px 12px; text-align: center; border: 1px solid rgba(0,200,255,0.4); transition: 0.25s; position: relative; }
        .stat-card:hover { transform: translateY(-4px); border-color: #00e0ff; background: rgba(20,60,100,0.7); }
        .stat-label { font-size: 14px; color: #b3e4ff; margin-bottom: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .stat-number { font-size: 32px; font-weight: 800; color: #ffd966; line-height: 1; }
        .gear-icon { display: inline-block; animation: spin 4s linear infinite; font-size: 20px; color: #ffd966; margin-left: 6px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 16px; padding: 14px 28px; background: rgba(5,18,34,0.8); border-bottom: 1px solid rgba(0,200,255,0.25); }
        .filter-group { display: flex; align-items: center; gap: 12px; background: rgba(15,40,65,0.7); padding: 6px 20px; border-radius: 40px; border: 1px solid rgba(0,200,255,0.5); }
        .filter-group select, .filter-group input { background: transparent; border: none; color: #ffda99; font-size: 13px; outline: none; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg,#00a6ff,#0077ff); border: none; padding: 6px 28px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: linear-gradient(135deg,#2bb8ff,#0088ff); transform: scale(1.02); }
        .map-header-control { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 8px; }
        .btn-back { background: rgba(30,70,110,0.8); border: 1px solid #0af; color: #eef5ff; padding: 6px 20px; border-radius: 30px; font-size: 12px; cursor: pointer; }
        .main-grid { display: grid; grid-template-columns: 1fr 360px; gap: 24px; padding: 24px 28px; }
        .left-col { display: flex; flex-direction: column; gap: 24px; }
        .map-wrapper { display: flex; gap: 20px; background: rgba(8,25,45,0.7); border-radius: 28px; border: 1px solid rgba(0,200,255,0.4); padding: 12px; }
        .map-container { flex: 3; }
        .status-panel { flex: 1; background: rgba(5,20,35,0.6); border-radius: 20px; padding: 12px; border-left: 2px solid #00aaff; }
        .status-panel h4 { font-size: 14px; margin-bottom: 12px; color: #bbf0ff; text-align: center; }
        .status-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
        .status-color { width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; }
        .status-name { flex: 1; }
        .status-count { font-weight: bold; color: #ffd966; }
        #chinaMap { width: 100%; height: 460px; border-radius: 20px; background: #051a2c; }
        .live-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
        .live-feed { background: rgba(8,25,45,0.7); border-radius: 24px; border: 1px solid rgba(0,180,255,0.4); padding: 12px 16px; }
        .live-feed h4 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .live-feed h4 i { color: #00ccff; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
        .scroll-list-container-fixed { height: 130px; overflow: hidden; position: relative; background: rgba(0,0,0,0.3); border-radius: 16px; padding: 8px; }
        .scroll-list { animation: scrollUp 20s linear infinite; }
        .scroll-list:hover { animation-play-state: paused; }
        @keyframes scrollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        .scroll-list-container-large { height: 280px; overflow: hidden; position: relative; }
        .legend-item { display: inline-flex; align-items: center; gap: 8px; margin-right: 20px; font-size: 12px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .funnel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
        .chart-card { background: rgba(8,25,45,0.75); border-radius: 24px; border: 1px solid rgba(0,180,255,0.4); padding: 18px 16px; display: flex; flex-direction: column; height: auto; transition: height 0.2s; }
        .chart-title { font-size: 16px; font-weight: 600; color: #f0fcff; margin-bottom: 16px; border-left: 4px solid #00ccff; padding-left: 10px; display: flex; justify-content: space-between; align-items: center; }
        .chart-container { flex: 1; min-height: 260px; width: 100%; }
        .right-col { display: flex; flex-direction: column; gap: 24px; }
        .risk-card, .quality-card, .cost-card { background: rgba(8,25,45,0.75); border-radius: 24px; border: 1px solid rgba(0,180,255,0.4); padding: 18px 16px; }
        .sub-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
        .list-item { display: flex; justify-content: space-between; padding: 10px 6px; border-bottom: 1px solid rgba(0,180,255,0.3); font-size: 13px; cursor: pointer; }
        .badge { background: #ffaa33; border-radius: 30px; padding: 2px 12px; font-size: 11px; color: #0a1a2a; font-weight: bold; }
        .progress-bar { height: 8px; background: #1e3a5f; border-radius: 6px; margin: 8px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #00ccff; width: 0%; }
        .bottom-area { display: grid; grid-template-columns: 1.2fr 1.5fr 1.8fr; gap: 24px; padding: 20px 28px 32px; background: rgba(2,12,27,0.6); border-top: 1px solid rgba(0,200,255,0.3); }
        .anomaly-card, .patrol-card, .satisfaction-card { background: rgba(10,35,55,0.7); border-radius: 24px; padding: 16px; border: 1px solid rgba(0,200,255,0.4); }
        .chart-switch { display: flex; gap: 12px; margin-bottom: 12px; }
        .switch-btn { background: #1e4a76; border: none; padding: 4px 12px; border-radius: 20px; color: white; cursor: pointer; font-size: 12px; }
        .switch-btn.active { background: #00aaff; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 2000; }
        .modal.active { display: flex; }
        .modal-content { background: linear-gradient(145deg,#0a2a44,#031a2c); border-radius: 36px; width: 90%; max-width: 1300px; max-height: 85%; overflow: auto; padding: 24px; border: 1px solid #00ccff; }
        .modal-header { font-size: 22px; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .close-modal { cursor: pointer; font-size: 28px; color: #00ccff; }
        table { width: 100%; border-collapse: collapse; color: #eef5ff; font-size: 13px; }
        th, td { border: 1px solid #2f6080; padding: 8px 10px; text-align: left; }
        th { background: #0a3a5a; }
        @media (max-width: 1600px) { .top-stats { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 1200px) { .top-stats { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 1400px){ .main-grid{ grid-template-columns:1fr; } .bottom-area{ grid-template-columns:1fr; } .map-wrapper{ flex-direction: column; } .live-row{ grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="top-header">
        <div class="current-time"><i class="fas fa-calendar-alt"></i> <span id="liveDateTime">2026-03-23 14:28:36</span></div>
    </div>
    <div class="top-stats">
        <div class="stat-card"><div class="stat-label"><i class="fas fa-layer-group"></i> 项目总数 <i class="fas fa-cog gear-icon"></i></div><div class="stat-number" id="totalProjects">0</div></div>
        <div class="stat-card"><div class="stat-label"><i class="fas fa-check-circle"></i> 本年度完成</div><div class="stat-number">412</div></div>
        <div class="stat-card"><div class="stat-label"><i class="fas fa-plus-circle"></i> 本月新增</div><div class="stat-number">93</div></div>
        <div class="stat-card"><div class="stat-label"><i class="fas fa-hard-hat"></i> 本月在建</div><div class="stat-number" id="buildingCount">0</div></div>
        <div class="stat-card"><div class="stat-label"><i class="fas fa-flag-checkered"></i> 本月完工</div><div class="stat-number">168</div></div>
        <div class="stat-card"><div class="stat-label"><i class="fas fa-clock"></i> 平均施工期</div><div class="stat-number">19.2<span class="stat-unit">天</span></div></div>
        <div class="stat-card"><div class="stat-label"><i class="fas fa-coins"></i> 单店平均成本</div><div class="stat-number">28.6<span class="stat-unit">万</span></div></div>
        <div class="stat-card"><div class="stat-label"><i class="fas fa-chart-line"></i> 预算结算偏差率</div><div class="stat-number">+4.2<span class="stat-unit">%</span></div></div>
    </div>

    <div class="filter-bar">
        <div class="filter-group"><label>大区</label><select id="regionSelect"><option value="all">全部</option><option>华东</option><option>华南</option></select></div>
        <div class="filter-group"><label>省份</label><select id="provinceSelect"><option value="all">全部</option><option>广东</option><option>浙江</option><option>江苏</option><option>四川</option><option>湖北</option><option>河南</option><option>湖南</option><option>陕西</option></select></div>
        <div class="filter-group"><label>品牌</label><select id="brandSelect"><option value="all">全部</option><option>零食很忙</option><option>赵一鸣</option></select></div>
        <button class="btn-primary" id="applyFilterBtn">应用筛选</button>
        <button class="btn-primary" id="resetFilterBtn" style="background:#2a5f7a;">重置</button>
    </div>

    <div class="main-grid">
        <div class="left-col">
            <div class="map-wrapper">
                <div class="map-container">
                    <div class="map-header-control"><span><i class="fas fa-chart-pie"></i> 全国项目分布 · 颜色:状态 | 大小:面积</span><button id="backToChinaBtn" class="btn-back" style="display:none;">返回全国</button></div>
                    <div id="chinaMap" style="height:460px;"></div>
                </div>
                <div class="status-panel" id="statusPanel">
                    <h4><i class="fas fa-chart-simple"></i> 项目状态统计</h4>
                    <div id="statusList"></div>
                </div>
            </div>
            <!-- 双列动态滚动区域 -->
            <div class="live-row">
                <div class="live-feed">
                    <h4><i class="fas fa-bell"></i> 实时项目动态 <span style="font-size:11px;">(无限滚动)</span></h4>
                    <div class="scroll-list-container-fixed">
                        <div id="liveScrollList" class="scroll-list"></div>
                    </div>
                </div>
                <div class="live-feed">
                    <h4><i class="fas fa-calendar-check"></i> 本月完工项目动态 <span style="font-size:11px;">(无限滚动)</span></h4>
                    <div class="scroll-list-container-fixed">
                        <div id="monthFinishScrollList" class="scroll-list"></div>
                    </div>
                </div>
            </div>
            <div class="funnel-row" id="funnelRow">
                <div class="chart-card" id="funnelCard">
                    <div class="chart-title">项目阶段漏斗转化</div>
                    <div id="funnelChart" class="chart-container"></div>
                </div>
                <div class="chart-card" id="durationCard">
                    <div class="chart-title">各节点平均时效 (天)</div>
                    <div id="nodeDurationChart" class="chart-container"></div>
                </div>
            </div>
        </div>
        <div class="right-col">
            <div class="risk-card">
                <div class="sub-title"><span><i class="fas fa-exclamation-triangle"></i> 超期项目列表 (TOP10·滚动)</span><span style="font-size:12px; cursor:pointer; color:#66e0ff;" onclick="showOverdueModal()">查看全部 <i class="fas fa-chevron-right"></i></span></div>
                <div class="scroll-list-container-large">
                    <div id="overdueList" class="scroll-list"></div>
                </div>
            </div>
            <div class="quality-card" id="qualityCard">
                <div class="sub-title"><span>验收合格率</span><span id="acceptRate" style="color:#ffcc66;">92.3%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:92.3%"></div></div>
                <div class="sub-title"><span>验收整改问题TOP10</span><span style="font-size:12px; cursor:pointer; color:#66e0ff;" onclick="showAcceptModal()">更多 <i class="fas fa-external-link-alt"></i></span></div>
                <div id="topIssueList"></div>
                <div class="sub-title"><span>施工单位整改TOP10</span><span style="font-size:12px; cursor:pointer; color:#66e0ff;" onclick="showCompanyModal()">更多 <i class="fas fa-external-link-alt"></i></span></div>
                <div id="companyIssueList"></div>
            </div>
        </div>
    </div>

    <div class="bottom-area">
        <div class="anomaly-card">
            <div class="sub-title"><span><i class="fas fa-chart-line"></i> 项目异常统计</span><button class="btn-primary" style="padding:2px 12px; font-size:12px;" onclick="showAnomalyMatrix()">查看详情</button></div>
            <div class="chart-switch"><button id="switchNodeBtn" class="switch-btn active">按节点</button><button id="switchRegionBtn" class="switch-btn">按大区</button></div>
            <div id="anomalyChart" style="height:200px;"></div>
        </div>
        <div class="patrol-card">
            <div class="sub-title"><span><i class="fas fa-clipboard-list"></i> 巡检不合格项TOP10</span><button class="btn-primary" style="padding:2px 12px; font-size:12px;" onclick="showPatrolModal()">更多 & 下钻</button></div>
            <div id="patrolTopList"></div>
        </div>
        <div class="satisfaction-card">
            <div class="sub-title"><span><i class="fas fa-chart-pie"></i> 工程回访满意度</span><span style="font-size:11px; color:#aaf;">A非常满意 B满意 C一般 D不满意</span></div>
            <div id="satisfactionChart" style="height:220px;"></div>
        </div>
    </div>
</div>

<div id="dynamicModal" class="modal"><div class="modal-content" id="modalDynamicContent"></div></div>

<script>
    // ---------- 项目状态常量 ----------
    const statusListOrder = ["待分配","待确认","勘场中","定稿中","设计中","施工中","验收交付中","工程结算中","暂停中","已终止"];
    const statusColorMap = { "待分配":"#6c757d","待确认":"#adb5bd","勘场中":"#4d9eff","定稿中":"#3ac0ff","设计中":"#2c7da0","施工中":"#FF7300","验收交付中":"#9b59b6","工程结算中":"#f1c40f","暂停中":"#ff4d4f","已终止":"#2c3e50" };
    
    // 生成丰富项目数据
    let allProjects = [];
    const provinces = ["广东","浙江","江苏","四川","湖北","河南","湖南","陕西"];
    const cities = { "广东":["广州","深圳"],"浙江":["杭州","宁波"],"江苏":["南京","苏州"],"四川":["成都"],"湖北":["武汉"],"河南":["郑州"],"湖南":["长沙"],"陕西":["西安"] };
    for(let i=1;i<=200;i++){
        let prov = provinces[i%provinces.length];
        let city = cities[prov] ? cities[prov][i%cities[prov].length] : "中心";
        let status = statusListOrder[i%statusListOrder.length];
        let area = 80 + Math.random() * 180;
        let endMonth = (i % 5 === 0) ? 3 : (Math.floor(Math.random()*4)+2);
        let endDate = `2026-${String(endMonth).padStart(2,'0')}-${Math.floor(Math.random()*28+1)}`;
        let startDate = `2026-0${Math.floor(Math.random()*2+1)}-${Math.floor(Math.random()*28+1)}`;
        allProjects.push({
            id:`P${i}`, name:`${prov}${city}项目${i}`, province:prov, city:city,
            lng: 112 + (prov==="广东"?1.5: (prov==="浙江"?2: (prov==="江苏"?1.8: Math.random()*8))),
            lat: 30 + (prov==="广东"?-7: (prov==="浙江"?0.5: (prov==="四川"?0.2: Math.random()*5))),
            status:status, area:area, manager:`张${i%10}`, deadline:endDate, brand:i%2?"零食很忙":"赵一鸣", type:i%3?"新建":"翻新",
            startDate:startDate, endDate:endDate, createDate:`2025-${Math.floor(Math.random()*12+1)}-10`,工时:`${30+i%40}天`,工期:50+i%60
        });
    }
    // 修正坐标
    allProjects.forEach(p=>{ if(p.province==="广东"){ p.lng=113.2+Math.random()*2; p.lat=22.5+Math.random()*1.5; } if(p.province==="浙江"){ p.lng=119.5+Math.random()*2; p.lat=29.5+Math.random()*1; } if(p.province==="江苏"){ p.lng=118.5+Math.random()*2; p.lat=31.5+Math.random()*1; } if(p.province==="四川"){ p.lng=103.8+Math.random()*1.5; p.lat=30.2+Math.random()*1; } if(p.province==="湖北"){ p.lng=113.8+Math.random()*1; p.lat=30.2+Math.random()*0.8; } if(p.province==="河南"){ p.lng=113.2+Math.random()*1.5; p.lat=34.2+Math.random()*1; } if(p.province==="湖南"){ p.lng=112.5+Math.random()*1.5; p.lat=28.0+Math.random()*1; } if(p.province==="陕西"){ p.lng=108.5+Math.random()*1.5; p.lat=34.0+Math.random()*1; } });

    let currentFilterProvince = "all", isProvinceMode=false, currentProvince=null;
    let mapChart, funnelChart, durationChart, satisfactionChart, anomalyChart;
    let anomalyViewType = "node";

    function getDisplayProjects() { 
        let list = [...allProjects]; 
        if(isProvinceMode && currentProvince) list = list.filter(p=>p.province===currentProvince); 
        else if(currentFilterProvince !== "all") list = list.filter(p=>p.province===currentFilterProvince); 
        return list; 
    }
    function updateStatsAndPanel() { 
        let projs = getDisplayProjects(); 
        document.getElementById("totalProjects").innerText=projs.length; 
        document.getElementById("buildingCount").innerText=projs.filter(p=>p.status==="施工中").length; 
        let statusCount = {};
        statusListOrder.forEach(s=>statusCount[s]=0);
        projs.forEach(p=>statusCount[p.status]++);
        let panelHtml = '';
        for(let s of statusListOrder){
            panelHtml += `<div class="status-item"><div style="display:flex; align-items:center;"><span class="status-color" style="background:${statusColorMap[s]};"></span><span class="status-name">${s}</span></div><span class="status-count">${statusCount[s]}</span></div>`;
        }
        document.getElementById("statusList").innerHTML = panelHtml;
    }

    // 地图渲染
    async function loadAndRegisterMap() {
        try {
            const res = await fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json');
            const geo = await res.json();
            echarts.registerMap('china', geo);
        } catch(e) { console.warn(e); echarts.registerMap('china', {}); }
        renderMap();
    }
    function renderMap(){
        if(mapChart) mapChart.dispose();
        mapChart = echarts.init(document.getElementById("chinaMap"));
        let projs = getDisplayProjects();
        let center=[104,35], zoom=1.2;
        if(isProvinceMode && currentProvince){
            const provinceCenters = {"广东":[113.5,23.0],"浙江":[120.5,29.5],"江苏":[119.0,32.5],"四川":[104.0,30.5],"湖北":[112.5,31.0],"河南":[113.5,34.0],"湖南":[112.5,28.0],"陕西":[109.0,35.5]};
            center = provinceCenters[currentProvince] || [112,33];
            zoom = 1.6;
        }
        const geoOption = {
            map:'china', roam:true, zoom:zoom, center:center,
            label:{ show:!isProvinceMode, fontSize:12, color:'#b8f2ff', fontWeight:'normal' },
            itemStyle:{ borderColor:'#3f8eff', areaColor:'#0a2a4a' },
            emphasis:{ label:{ show:true }, itemStyle:{ areaColor:'#2f6a9e' } },
            tooltip:{ show:true, formatter:(params)=>{
                if(isProvinceMode) return null;
                if(params.componentType==='geo' && params.name){
                    let stats = {}; statusListOrder.forEach(s=>stats[s]=0);
                    allProjects.filter(p=>p.province===params.name).forEach(p=>stats[p.status]++);
                    let html = `<strong>${params.name}省项目状态分布</strong><br/>`;
                    for(let s of statusListOrder) if(stats[s]>0) html+=`${s}: ${stats[s]}个<br/>`;
                    return html;
                }
                return params.name;
            } }
        };
        const series = [{
            name:'项目分布', type:'scatter', coordinateSystem:'geo',
            data: projs.map(p=>({ name:p.name, value:[p.lng,p.lat], status:p.status, area:p.area, manager:p.manager, startDate:p.startDate, deadline:p.endDate, province:p.province, city:p.city })),
            symbolSize: val=>val.area>=150?18:12,
            itemStyle:{ color:param=>statusColorMap[param.data.status]||'#FF7300', borderColor:'#fff', borderWidth:1 },
            label:{ show:false },
            emphasis:{ scale:1.3, label:{ show:true, formatter:'{b}', position:'top' } },
            tooltip:{ formatter:(params)=>{
                let d = params.data;
                return `<strong>${d.name}</strong><br/>详细地址: ${d.province}省 ${d.city}<br/>当前节点: ${d.status}<br/>负责人: ${d.manager}<br/>预计开始: ${d.startDate}<br/>预计完工: ${d.deadline}`;
            } }
        }];
        mapChart.setOption({ geo:geoOption, series:series });
        mapChart.off('click');
        mapChart.on('click', { componentType: 'geo' }, (params) => {
            if(!isProvinceMode && params.componentType==='geo' && params.name && provinces.includes(params.name)){
                drillDown(params.name);
            }
        });
        mapChart.on('click', { seriesName: '项目分布' }, (params) => { if(params.data) showProjectDetail(params.data.name); });
    }
    function drillDown(province){ isProvinceMode=true; currentProvince=province; currentFilterProvince=province; document.getElementById('backToChinaBtn').style.display='flex'; renderMap(); updateStatsAndPanel(); }
    function backToChina(){ isProvinceMode=false; currentProvince=null; currentFilterProvince="all"; document.getElementById('backToChinaBtn').style.display='none'; renderMap(); updateStatsAndPanel(); }

    // 图表初始化

            tooltip:{ trigger:'item', formatter:'{b}: {c}个 ({d}%)' },

                data:[
                    {name:'项目确认', value:1250},{name:'线下勘场', value:1120},{name:'勘场定稿', value:980},
                    {name:'工程设计', value:910},{name:'工程预算', value:860},{name:'工程施工', value:780},
                    {name:'施工巡检', value:720},{name:'项目验收', value:650},{name:'工程整改', value:610},
                    {name:'工程结算', value:580}

    function initNodeDuration(){
        durationChart = echarts.init(document.getElementById("nodeDurationChart"));

            tooltip:{ trigger:'axis' }, grid:{ containLabel:true },
            xAxis:{ type:'category', data:['项目确认','线下勘场','勘场定稿','工程设计','工程预算','工程施工','施工巡检','项目验收','工程整改','工程结算'], axisLabel:{ rotate:30, color:'#ccf0ff' } },
            yAxis:{ name:'天数' }, series:[{ data:[1.2,2.5,1.8,3.2,2.0,16.8,1.5,2.2,1.9,1.5], type:'bar', itemStyle:{ color:'#00b4ff', borderRadius:[6,6,0,0], label:{ show:true, position:'top', color:'#ffdd99' } } }]
        });
    }
    function initSatisfaction(){
        satisfactionChart = echarts.init(document.getElementById("satisfactionChart"));
        const dimensions = ['工程设计','工程监理','工程预结算','装修公司','广告公司','冷链公司','监控公司','货架公司','建店整体'];
        const dataA = [45, 38, 30, 42, 48, 35, 40, 52, 46];
        const dataB = [35, 40, 38, 36, 32, 40, 38, 30, 34];
        const dataC = [15, 17, 22, 16, 14, 18, 16, 12, 14];
        const dataD = [5, 5, 10, 6, 6, 7, 6, 6, 6];
        satisfactionChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: (params) => {
                let str = params[0].axisValue + '<br/>';
                params.forEach(p => str += `${p.marker} ${p.seriesName}: ${p.value}%<br/>`);
                return str;
            } },
            legend: { data: ['A非常满意', 'B满意', 'C一般', 'D不满意'], textStyle: { color: '#fff' }, itemWidth: 20, right: 0 },
            grid: { left: '12%', containLabel: true },
            xAxis: { type: 'value', name: '百分比 (%)', axisLabel: { color: '#ccc' } },
            yAxis: { type: 'category', data: dimensions, axisLabel: { color: '#eef5ff', fontSize: 11 } },
            series: [
                { name: 'A非常满意', type: 'bar', stack: 'total', data: dataA, itemStyle: { color: '#3ac0ff' } },
                { name: 'B满意', type: 'bar', stack: 'total', data: dataB, itemStyle: { color: '#66cc99' } },
                { name: 'C一般', type: 'bar', stack: 'total', data: dataC, itemStyle: { color: '#ffaa66' } },
                { name: 'D不满意', type: 'bar', stack: 'total', data: dataD, itemStyle: { color: '#ff6666' } }
            ]
        });
    }
    function renderAnomalyChart(){
        if(anomalyChart) anomalyChart.dispose();
        anomalyChart = echarts.init(document.getElementById("anomalyChart"));
        if(anomalyViewType === "node"){
            const nodeNames = ['线下勘场','勘场定稿','工程设计','工程预算','工程施工','项目验收','工程整改','工程结算'];
            const anomalyData = [12,8,15,10,42,18,22,14];
            anomalyChart.setOption({ tooltip:{}, xAxis:{ type:'category', data:nodeNames, axisLabel:{ rotate:30, color:'#ccc' } }, yAxis:{ name:'异常数量' }, series:[{ data:anomalyData, type:'bar', itemStyle:{ color:'#ff8866', borderRadius:[6,6,0,0], label:{ show:true } } }] });
        } else {
            const regions = ["西北大区","云南大区","浙江大区","东北华北大区","福建大区","项目1区(桂琼)","项目2区(湘赣)","项目3区(贵渝青)","河南大区","四川大区","湖北大区","苏沪大区","安徽大区","广东大区","黑龙江大区"];
            const regionData = regions.map(()=>Math.floor(Math.random()*30+5));
            anomalyChart.setOption({ tooltip:{}, xAxis:{ type:'category', data:regions, axisLabel:{ rotate:45, color:'#ccc', interval:0 } }, yAxis:{ name:'异常数量' }, series:[{ data:regionData, type:'bar', itemStyle:{ color:'#66cc99', borderRadius:[6,6,0,0], label:{ show:true, rotate:90 } } }] });
        }
    }

    // ---------- 无限滚动列表渲染函数 ----------
    const overdueProjectsList = [
        {name:"杭州西湖店",超期天数:12,预计结束:"2026-03-28"},{name:"武汉光谷店",超期天数:9,预计结束:"2026-05-01"},{name:"广州天河店",超期天数:7,预计结束:"2026-04-15"},
        {name:"南京新街口",超期天数:5,预计结束:"2026-04-05"},{name:"郑州金水店",超期天数:4,预计结束:"2026-04-10"},{name:"成都锦江店",超期天数:3,预计结束:"2026-02-20"},
        {name:"长沙五一店",超期天数:2,预计结束:"2026-03-30"},{name:"深圳南山店",超期天数:1,预计结束:"2026-04-12"},{name:"苏州观前店",超期天数:0,预计结束:"2026-03-01"},

        "广东省-广州天河店----工程支持李响已完成项目确认",

    function addLiveMessage() {
        const newMsg = `⚡ ${liveMessagesQueue[liveMessagesQueue.length % liveMessagesQueue.length]}`;

        renderLiveFeed();
    }
    function renderLiveFeed() {
        let items = liveMessagesQueue.map(msg => `<div class="list-item" style="justify-content:flex-start; gap:8px;"><i class="fas fa-dot-circle" style="color:#00ccff;"></i><span>${msg}</span></div>`).join('');
        document.getElementById("liveScrollList").innerHTML = items + items;
    }

    // 右侧其他数据
    const acceptIssues = ["招牌画面","招牌收边","室外灯箱","室内广告","墙面空鼓","电路接地不良","防水层渗漏","门头灯箱色差","地砖平整度","消防栓遮挡"].map((n,i)=>({name:n,count:12+Math.floor(Math.random()*30),projectNum:3+i}));
    const companyIssues = ["中天建设","龙兴建安","华西装饰","建工集团","广厦营造","欣荣装饰","新艺广告","恒达建设","鼎盛工程","宏达装饰"].map((c,i)=>({name:c,count:20-i*1.2,projectNum:5+i}));
    const patrolItems = [{item:"招牌画面",count:28},{item:"招牌收边",count:24},{item:"室外灯箱",count:19},{item:"室内广告",count:17},{item:"墙面区域*板材安装",count:15},{item:"电路板块*强电",count:12},{item:"天花区域*灯具安装",count:10},{item:"仓库地面",count:8},{item:"收银台背景墙",count:7},{item:"打胶情况",count:6}];
    function renderRightPanel(){ 
        let issuesHtml=''; acceptIssues.slice(0,10).forEach(issue=>{ issuesHtml+=`<div class="list-item"><span>${issue.name}</span><span>${issue.count}次</span></div>`; }); document.getElementById('topIssueList').innerHTML=issuesHtml;
        let compHtml=''; companyIssues.slice(0,10).forEach((c,idx)=>{ compHtml+=`<div class="list-item" style="background:${idx%2?'rgba(0,150,255,0.1)':'transparent'}"><span>${c.name}</span><span>${Math.floor(c.count)}次</span></div>`; }); document.getElementById('companyIssueList').innerHTML=compHtml;
        let patrolHtml=''; patrolItems.slice(0,10).forEach(p=>{ patrolHtml+=`<div class="list-item"><span>${p.item}</span><span>${p.count}次</span></div>`; }); document.getElementById('patrolTopList').innerHTML=patrolHtml;
    }

    // 时间更新
    function updateDateTime() {
        const now = new Date();
        const formatted = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        document.getElementById("liveDateTime").innerText = formatted;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // 动态对齐图表高度（使漏斗图卡片和时效卡片与右侧qualityCard底部对齐）
    function alignChartHeights() {
        const qualityCard = document.getElementById('qualityCard');
        const funnelCard = document.getElementById('funnelCard');
        const durationCard = document.getElementById('durationCard');
        if(!qualityCard || !funnelCard || !durationCard) return;
        const targetHeight = qualityCard.offsetHeight;
        if(targetHeight > 0) {
            funnelCard.style.height = targetHeight + 'px';
            durationCard.style.height = targetHeight + 'px';
            // 触发内部图表resize，确保图表自适应新高度
            if(funnelChart) funnelChart.resize();
            if(durationChart) durationChart.resize();
        }
    }

    // 弹窗函数 (保持原样)
    function showProjectDetail(name){ let p=allProjects.find(x=>x.name===name); if(p){ document.getElementById('modalDynamicContent').innerHTML=`<div class="modal-header"><span>项目详情</span><span class="close-modal" onclick="closeModal()">×</span></div><div>项目名称:${p.name}<br/>详细地址:${p.province}省 ${p.city}<br/>当前节点:${p.status}<br/>负责人:${p.manager}<br/>预计开始:${p.startDate}<br/>预计完工:${p.endDate}<br/>项目工期:${p.工期}天<br/>项目工时:${p.工时}</div>`; document.getElementById('dynamicModal').classList.add('active'); } }
    function closeModal(){ document.getElementById('dynamicModal').classList.remove('active'); }
    function showOverdueModal(){ let html=`<div class="modal-header"><span>超期项目列表</span><span class="close-modal" onclick="closeModal()">×</span></div><div style="overflow-x:auto;">`+'<table><thead><tr><th>项目编号</th><th>项目名称</th><th>品牌</th><th>工程类型</th><th>区域地址</th><th>项目状态</th><th>超期时间</th><th>工程监理</th><th>开始时间</th><th>结束时间</th></tr></thead><tbody>'+
        allProjects.slice(0,30).map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${p.brand}</td><td>${p.type}</td><td>${p.province}省${p.city}</td><td>${p.status}</td><td>${Math.floor(Math.random()*15)}天</td><td>${p.manager}</td><td>${p.startDate}</td><td>${p.endDate}</td></tr>`).join('')+'</tbody></table></div>'; document.getElementById('modalDynamicContent').innerHTML=html; document.getElementById('dynamicModal').classList.add('active'); }
    function showAcceptModal(){ let html=`<div class="modal-header"><span>验收整改问题TOP10</span><span class="close-modal" onclick="closeModal()">×</span></div><table><thead><tr><th>验收项</th><th>不合格整改项</th><th>关联项目数量</th></tr></thead><tbody>${acceptIssues.map(i=>`<tr><td>${i.name}</td><td>${i.name}不合格</td><td class="clickable" onclick="alert('涉及项目: P001,P002 等')">${i.projectNum}个</td></tr>`).join('')}</tbody></table><button onclick="alert('导出CSV')">导出CSV</button>`; document.getElementById('modalDynamicContent').innerHTML=html; document.getElementById('dynamicModal').classList.add('active'); }
    function showCompanyModal(){ let html=`<div class="modal-header"><span>施工单位整改TOP10</span><span class="close-modal" onclick="closeModal()">×</span></div><table><thead><tr><th>施工单位名称</th><th>整改项次数</th><th>关联项目数量</th></tr></thead><tbody>${companyIssues.map(c=>`<tr><td>${c.name}</td><td>${Math.floor(c.count)}次</td><td class="clickable" onclick="alert('关联项目: P00x')">${c.projectNum}个</td></tr>`).join('')}</tbody></table><button onclick="alert('导出')">导出CSV</button>`; document.getElementById('modalDynamicContent').innerHTML=html; document.getElementById('dynamicModal').classList.add('active'); }
    function showPatrolModal(){ let html=`<div class="modal-header"><span>巡检不合格项TOP10</span><span class="close-modal" onclick="closeModal()">×</span></div><table><thead><tr><th>巡查事项</th><th>不合格项</th><th>不合格次数</th></tr></thead><tbody>${patrolItems.map(p=>`<tr><td>${p.item}</td><td>${p.item}</td><td class="clickable" onclick="alert('涉及项目: 杭州西湖店,广州天河店')">${p.count}次</td></tr>`).join('')}</tbody></table><button onclick="alert('导出CSV')">导出CSV</button>`; document.getElementById('modalDynamicContent').innerHTML=html; document.getElementById('dynamicModal').classList.add('active'); }
    function showAnomalyMatrix(){ let nodes=["线下勘场","勘场定稿","工程设计","工程预算","工程施工","项目验收","工程整改","工程结算"]; let regions=["西北大区","云南大区","浙江大区","东北华北大区","福建大区","项目1区(桂琼)","项目2区(湘赣)","项目3区(贵渝青)","河南大区","四川大区","湖北大区","苏沪大区","安徽大区","广东大区","黑龙江大区"]; let matrix=regions.map(()=>nodes.map(()=>Math.floor(Math.random()*8))); let html=`<div class="modal-header"><span>项目异常统计矩阵</span><span class="close-modal" onclick="closeModal()">×</span></div><div style="overflow-x:auto;"><table><thead><tr><th>大区\\节点</th>${nodes.map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${regions.map((r,i)=>`<tr><td>${r}</td>${nodes.map((_,j)=>`<td>${matrix[i][j]}</td>`).join('')}</tr>`).join('')}</tbody></table><button onclick="alert('导出CSV')">导出CSV</button></div>`; document.getElementById('modalDynamicContent').innerHTML=html; document.getElementById('dynamicModal').classList.add('active'); }

    window.addEventListener('load', async () => {
        await loadAndRegisterMap();
        initFunnel();
        initNodeDuration();
        initSatisfaction();
        renderOverdueScroll();
        renderLiveFeed();
        renderMonthFinishProjects();
        renderRightPanel();
        updateStatsAndPanel();
        renderAnomalyChart();
        setTimeout(alignChartHeights, 300);
        window.addEventListener('resize', () => {
            alignChartHeights();

            if(funnelChart) funnelChart.resize();
            if(durationChart) durationChart.resize();

            if(anomalyChart) anomalyChart.resize();

        document.getElementById('switchNodeBtn').onclick=()=>{ anomalyViewType='node'; document.getElementById('switchNodeBtn').classList.add('active'); document.getElementById('switchRegionBtn').classList.remove('active'); renderAnomalyChart(); };

        window.closeModal=closeModal; window.showProjectDetail=showProjectDetail; window.showOverdueModal=showOverdueModal; window.showAcceptModal=showAcceptModal; window.showCompanyModal=showCompanyModal; window.showPatrolModal=showPatrolModal; window.showAnomalyMatrix=showAnomalyMatrix;
        setInterval(() => { addLiveMessage(); }, 5000);
        setInterval(() => { renderMonthFinishProjects(); }, 8000);
        for(let i=0;i<3;i++) addLiveMessage();
